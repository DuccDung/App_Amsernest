<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Create News Post</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <!-- TinyMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
          tinymce.init({
            selector: '#content',
            height: 300,
            plugins: 'link image code lists',
            toolbar: 'undo redo | styles | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
          });
        });
    </script>
</head>

<body>
    <div class="container mt-5">
        <h2>
            <i class="fa-solid fa-globe"></i> Create new Campus
        </h2>

        <form id="postForm">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter post title" required />
            </div>

            <div class="mb-3">
                <label for="summary" class="form-label">Summary</label>
                <textarea id="summary" class="form-control" rows="3" placeholder="Short description..."></textarea>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Content</label>
                <textarea id="content" name="content"></textarea>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Thumbnail Image</label>
                <input type="file" id="image" class="form-control" accept="image/*" />
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Publish
            </button>
        </form>
    </div>
</body>

</html>
