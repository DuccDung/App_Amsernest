<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Teacher Images</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .event-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: #fff;
      text-align: center;
      padding: 10px;
    }
    .event-card img {
      width: 100%;
      height: auto; /* tự động theo tỉ lệ gốc */
      display: block;
    }
  </style>
</head>
<body>
  <div class="container my-5">
    <!-- Hàng 1 -->
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/ac_datlai.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_ankhanh.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_hagiang.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_havu.jpg" alt="Event Image">
        </div>
      </div>
    </div>

    <!-- Hàng 2 -->
    <div class="row g-4">
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_hung.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_linh.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_minh.jpg" alt="Event Image">
        </div>
      </div>
      <div class="col-md-3">
        <div class="event-card">
          <img src="/assets/img/teacher/coach_phuong.jpg" alt="Event Image">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
